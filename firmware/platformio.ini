[platformio]
boards_dir = boards

; XiaoZhi-compatible Zhengchen 1.54-inch Wi-Fi board: ESP32-S3 N16R8 with
; a 240x240 ST7789.  Pinout matches xiaodai's zhengchen-1.54tft-wifi board:
; MOSI=41, SCLK=42, RST=45, DC=40, CS=21, BL=20 (active HIGH); MISO is unused.
[env:xiaozhi-s3-lcd154]
platform = espressif32@6.13.0
board = xiaozhi_s3_lcd154
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_m5stack_16mb.csv
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.1
    bitbank2/AnimatedGIF@^2.2.0

build_flags =
    -D USER_SETUP_LOADED=1
    -D XIAOZHI_S3_LCD154=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_INVERSION_ON=1
    ; Required for TFT_eSPI on ESP32-S3 with the current Arduino framework.
    -D USE_FSPI_PORT=1
    -D TFT_SPI_MODE=3
    -D TFT_RGB_ORDER=TFT_RGB
    ; Zhengchen 1.54 TFT Wi-Fi (N16R8) on-board ST7789 wiring.
    -D TFT_MISO=-1
    -D TFT_MOSI=41
    -D TFT_SCLK=42
    -D TFT_CS=21
    -D TFT_DC=40
    -D TFT_RST=45
    -D TFT_BL=20
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; The reference firmware drives this panel in SPI mode 3 at 80 MHz.
    -D SPI_FREQUENCY=80000000
    -I include
    -D WM_STRINGS_FILE='"wm_strings_zh.h"'
