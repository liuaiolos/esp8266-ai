; M5GO IoT Kit v2.6 firmware - ESP32 with 16MB flash.
; Built-in 320x240 ILI9342C SPI TFT wiring (official M5GO v2.6 pin map):
;   MOSI=23, MISO=19, SCLK=18, CS=14, DC=27, RST=33, backlight=32 (active HIGH)

[platformio]
boards_dir = boards

[env:m5stack-core-esp32]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
; CH9102F on this M5GO intermittently drops its USB serial link at 460800.
; Use a conservative upload rate so a full application write can be verified.
upload_speed = 115200
board_upload.flash_size = 16MB
board_build.filesystem = littlefs
board_build.partitions = partitions_m5stack_16mb.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.1
    bitbank2/AnimatedGIF@^2.2.0

build_flags =
    ; ---- TFT_eSPI transport for M5GO v2.6's built-in 320x240 ILI9342C panel ----
    ; Keep ILI9341_DRIVER for M5Stack's 240x320 coordinate/rotation model. The
    ; The M5GO ILI9342C register sequence is applied by main.cpp.
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D M5STACK=1
    -D HAS_DAC_SPEAKER=1
    ; M5Stack panel is BGR; sprite payloads are byte-normalized separately
    ; before pushImage() in main.cpp.
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=14
    -D TFT_DC=27
    -D TFT_RST=33
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    ; ---- WiFiManager: Chinese captive-portal strings (include/wm_strings_zh.h) ----
    -I include
    -D WM_STRINGS_FILE='"wm_strings_zh.h"'

; LilyGO T-Embed-CC1101: ESP32-S3 N16R8, ST7789 170x320 SPI TFT.
; This board's CH340 upload path may require BOOT + RST to enter download mode.
[env:t-embed-cc1101]
platform = espressif32@6.13.0
board = t_embed_cc1101
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_m5stack_16mb.csv
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.1
    bitbank2/AnimatedGIF@^2.2.0

build_flags =
    ; ---- LilyGO T-Embed-CC1101 ST7789 panel ----
    -D USER_SETUP_LOADED=1
    -D T_EMBED_CC1101=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=170
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_ON=1
    ; Work around TFT_eSPI's default SPI-port crash on ESP32-S3 / Arduino 2.0.17.
    -D USE_FSPI_PORT=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_MISO=10
    -D TFT_MOSI=9
    -D TFT_SCLK=11
    -D TFT_CS=41
    -D TFT_DC=16
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=80000000
    -I include
    -D WM_STRINGS_FILE='"wm_strings_zh.h"'

; XiaoZhi AI voice box / ESP32-S3 N16R8 with a 1.54-inch ST7789 (240x240).
; LCD: SCLK=21, MOSI=47, RST=45, DC=40, CS=41, BL=42 (active HIGH).
[env:xiaozhi-s3-lcd154]
platform = espressif32@6.13.0
board = xiaozhi_s3_lcd154
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_m5stack_16mb.csv
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.1
    bitbank2/AnimatedGIF@^2.2.0

build_flags =
    -D USER_SETUP_LOADED=1
    -D XIAOZHI_S3_LCD154=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_INVERSION_ON=1
    ; Required for TFT_eSPI on ESP32-S3 with the current Arduino framework.
    -D USE_FSPI_PORT=1
    -D TFT_RGB_ORDER=TFT_RGB
    ; Zhengchen 1.54 TFT Wi-Fi (N16R8) on-board ST7789 wiring.
    ; Verified from the original firmware's matching board configuration.
    -D TFT_MOSI=41
    -D TFT_SCLK=42
    -D TFT_CS=21
    -D TFT_DC=40
    -D TFT_RST=45
    -D TFT_BL=20
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -I include
    -D WM_STRINGS_FILE='"wm_strings_zh.h"'
